notes: >-
  The ChromaCode Cloud front end (chromacodecloud.com, production.chromacodecloud.com)
  is a single-page application whose catch-all route answers HTTP 200 with the SPA
  HTML shell for every unmatched path, including every /.well-known/* path. Those
  200s are NOT discovery documents and are recorded here as spa-catchall so a later
  round does not mistake them for hits. The only real machine-readable discovery
  documents ChromaCode serves are the two Keycloak OpenID Connect realm metadata
  documents on openid.chromacodecloud.com, saved verbatim alongside this index.

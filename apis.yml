aid: chromacode
name: ChromaCode
description: 'ChromaCode, Inc. is a Carlsbad, California molecular diagnostics company
  that applies digital signal processing and data science to standard PCR chemistry.
  Its High-Definition PCR (HDPCR) platform multiplexes more than four times the targets
  of conventional digital PCR on existing qPCR and dPCR instruments, with no new hardware,
  reagents, or workflow. The chemistry is paired with ChromaCode Cloud, a browser-based
  analysis platform that decodes raw PCR run files into interpreted variant calls,
  plate and well-level visualizations, and downloadable PDF reports that can be exported
  to LIMS and third-party reporting systems. Products span oncology tumor profiling
  (the HDPCR NSCLC panel), minimal residual disease and disease monitoring, transplant
  rejection, and previously an FDA EUA high-throughput SARS-CoV-2 assay. ChromaCode
  Cloud is a closed, customer-authenticated SaaS: it runs a REST API at chromacodecloud.com/api
  behind a Keycloak OpenID Connect identity provider whose discovery documents are
  publicly readable, but ChromaCode publishes no developer portal, OpenAPI definition,
  SDKs, or public API documentation.'

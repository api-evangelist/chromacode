apis:
- aid: chromacode:chromacode-cloud
  name: ChromaCode Cloud API
  description: 'The customer-authenticated REST API behind ChromaCode Cloud 6.1, the
    browser application that decodes HDPCR run files. Observed resource surface includes
    analyses, assays and assay downloads, batch reanalysis and reporting, instrument
    and instrument-info configuration, audit-log configuration, site banners, multipart
    upload initialize/update/finalize, an equalization-job endpoint, search, and document
    downloads (EULA, privacy policy, release notes, user guide). Every /api path returns
    HTTP 401 with a JSON authorization envelope when called anonymously; access is
    gated behind Keycloak OpenID Connect (realms "apps" and "cloud" at openid.chromacodecloud.com).
    ChromaCode publishes no OpenAPI definition, developer portal, or public reference
    for this surface — it is a product API for licensed laboratory customers.'
  humanURL: https://www.chromacode.com/chromacode-cloud/
  baseURL: https://chromacodecloud.com/api

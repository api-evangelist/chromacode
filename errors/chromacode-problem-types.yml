- status: 500
  name: Error
  title: secret option required for sessions
  description: >-
    Returned as an HTML Express error page on unmatched /api/* paths (for example
    /api/config, /api/version, /api/health). The session middleware throws before the
    router can produce a 404, so an unknown path surfaces as a 500 with a stack-trace
    page rather than a JSON 404. This is a real observed defect in error handling and
    an information-disclosure concern (internal file paths are echoed).
  media_type: text/html
  observed_at:
  - https://chromacodecloud.com/api/config
  - https://chromacodecloud.com/api/version
  - https://chromacodecloud.com/api/health
  remediation: Provider-side — return a JSON 404 for unknown API paths and suppress
    stack traces in production responses.
